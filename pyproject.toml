[build-system]
build-backend = "scikit_build_core.build"
requires = ["scikit-build-core>=0.10", "pybind11", "torch==2.7.1"]

[project]
name = "nvloader"
version = "0.1.0"
description = "video loading using nvdec"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "av>=17.1.0",
    "ipython>=8.39.0",
    "torch==2.7.1",
    "torchvision>=0.22.1",
    "tqdm>=4.70.1",
]
